<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>escape 4k!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;}
  #view{position:fixed;inset:0;touch-action:none;}
  #loading{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;}

  #intro{position:fixed;inset:0;z-index:30;user-select:none;cursor:default;}
  #intro .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;transition:opacity 0.4s ease;}
  #intro .layer.hidden{opacity:0;}
  #introLines{
    clip-path:circle(0px at 50% 50%);
    -webkit-clip-path:circle(0px at 50% 50%);
    will-change:clip-path;
  }
  #intro .hotspot{
    position:absolute;transform:translate(-50%,-50%);
    width:44px;height:44px;border-radius:50%;
    cursor:default;background:transparent;
    will-change:left,top;
  }
  #intro.hidden{opacity:0;pointer-events:none;transition:opacity 0.5s ease;}
  #intro.satellite .hotspot{display:none;}
  #intro.satellite #introDefault,
  #intro.satellite #introLines{opacity:0;}
  #intro.satellite #introSatellite{opacity:1;}

  #modeToggle{
    position:fixed;top:36px;left:40px;z-index:32;
    display:flex;flex-direction:column;gap:28px;
    font-family:Arial,sans-serif;font-weight:400;
    transition:opacity 0.4s ease;
  }
  #modeToggle.hidden{opacity:0;pointer-events:none;}
  #modeToggle button{
    background:transparent;color:#fff;border:none;padding:0;
    font-size:40px;line-height:1;cursor:pointer;text-align:left;
    font-family:Arial,sans-serif;font-weight:400;
    opacity:0.75;transition:opacity 0.2s ease;
  }
  #modeToggle button:hover,
  #modeToggle button.active{opacity:1;}

  #greenFlash{
    position:fixed;inset:0;z-index:35;background:#00FF00;
    opacity:0;pointer-events:none;transition:opacity 0.6s ease;
  }
  #greenFlash.show{opacity:1;}
  #greenFlash.fadeout{transition:opacity 1.2s ease;}

  #backBtn{
    position:fixed;top:16px;left:16px;z-index:15;
    background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.2);color:#fff;
    padding:8px 14px;border-radius:20px;font-size:12px;letter-spacing:0.15em;
    cursor:pointer;display:none;font-family:inherit;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #backBtn.show{display:block;}
  #backBtn:hover{background:rgba(0,0,0,0.55);}
</style>
</head>
<body>

  <div id="view"></div>
  <div id="loading">불러오는 중…</div>

  <div id="intro">
    <img class="layer" id="introDefault" src="img/인트로/디폴트.png" alt="">
    <img class="layer" id="introLines" src="img/인트로/디폴트_선.png" alt="">
    <img class="layer hidden" id="introSatellite" src="img/인트로/위성_1.jpeg" alt="">
  </div>

  <div id="modeToggle">
    <button data-mode="default" class="active">default</button>
    <button data-mode="satellite">satellite</button>
  </div>

  <div id="greenFlash"></div>

  <button id="backBtn">← 다시 선택</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const HOLD_DEGREES = 180;
const TRANSITION_DEGREES = 180;
const CYCLE_DEGREES = HOLD_DEGREES + TRANSITION_DEGREES;

// 인트로 이미지 위 흰 점 위치 (이미지 크기 대비 %). 실제 점 위치에 맞게 조정하세요.
const HOTSPOTS = [
  { country: '한국', xPct: 55.28, yPct: 39.87 },
  { country: '일본', xPct: 62.83, yPct: 46.01 },
  { country: '홍콩', xPct: 50.1, yPct: 62.01 },
  { country: '인도', xPct: 34.65, yPct: 63.8 }
];
const INTRO_CENTER = { xPct: 44.16, yPct: 50.84 };

const container = document.getElementById('view');
const loading = document.getElementById('loading');
const intro = document.getElementById('intro');
const introDefault = document.getElementById('introDefault');
const introLines = document.getElementById('introLines');
const greenFlash = document.getElementById('greenFlash');
const backBtn = document.getElementById('backBtn');

let sequenceData = null;
let currentCountry = null;
let renderer, scene, camera, material, textures = [];
let lon = 0, lat = 0, onDrag = false, sx = 0, sy = 0, sLon = 0, sLat = 0;
let prevLon = 0, spun = 0;
let sphereMesh = null;
let animating = false;

fetch('seqence.json')
  .then(r => r.json())
  .then(data => {
    sequenceData = data;
    buildHotspots();
    if (introDefault.complete) loading.style.display = 'none';
  })
  .catch(err => {
    loading.textContent = '데이터를 불러올 수 없습니다';
    console.error(err);
  });

introDefault.addEventListener('load', () => {
  if (sequenceData) loading.style.display = 'none';
});

const hotspotEls = [];
function buildHotspots(){
  HOTSPOTS.forEach(spot => {
    const info = sequenceData[spot.country];
    const hasImages = info && info.sequence && info.sequence.length > 0;
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.addEventListener('mouseenter', () => {
      if (spot._px) {
        introCenterPx = { x: spot._px.x, y: spot._px.y };
        introMaxRadius = spot._px.maxR;
        introLines.style.transform = `translate(${spot._px.dx}px, ${spot._px.dy}px)`;
      }
      hoveredSpot = hasImages ? spot : null;
      revealed = true;
      startClipAnim();
    });
    el.addEventListener('mouseleave', () => {
      hoveredSpot = null;
      revealed = false;
      startClipAnim();
    });
    intro.appendChild(el);
    hotspotEls.push({ el, spot });
  });
  positionHotspots();
}

// object-fit:cover 로 표시되는 이미지의 실제 그려진 영역을 계산해서 hotspot / clip-path 중심 배치
let introCenterPx = { x: 0, y: 0 };
let introNaturalCenter = { x: 0, y: 0 };
let introMaxRadius = 0;
function positionHotspots(){
  const iw = introDefault.naturalWidth, ih = introDefault.naturalHeight;
  if (!iw || !ih) return;
  const vw = innerWidth, vh = innerHeight;
  const scale = Math.max(vw/iw, vh/ih);
  const drawnW = iw*scale, drawnH = ih*scale;
  const offsetX = (vw - drawnW)/2;
  const offsetY = (vh - drawnH)/2;
  // 선 이미지의 원본 중심(INTRO_CENTER)이 object-fit:cover에서 놓이는 뷰포트 좌표 (element-local과 동일, 요소가 inset:0 이므로)
  const linesNaturalCx = offsetX + drawnW * INTRO_CENTER.xPct/100;
  const linesNaturalCy = offsetY + drawnH * INTRO_CENTER.yPct/100;
  introNaturalCenter = { x: linesNaturalCx, y: linesNaturalCy };
  hotspotEls.forEach(({el, spot}) => {
    const px = offsetX + drawnW * spot.xPct/100;
    const py = offsetY + drawnH * spot.yPct/100;
    el.style.left = px + 'px';
    el.style.top = py + 'px';
    // 각 hotspot을 중심으로 삼을 때의 최대 반경(모서리까지 거리) 캐시
    // + 선 이미지를 이 도시 위치로 옮기기 위한 translate 오프셋 계산
    spot._px = {
      x: px, y: py,
      dx: px - linesNaturalCx,
      dy: py - linesNaturalCy,
      maxR: Math.max(
        Math.hypot(px, py),
        Math.hypot(vw - px, py),
        Math.hypot(px, vh - py),
        Math.hypot(vw - px, vh - py)
      )
    };
  });
  applyIntroClip();
}

let revealed = false;
let currentRadius = 0;
let clipAnimId = null;
let hoveredSpot = null;
const CLIP_DURATION = 300; // ms

function setClip(r){
  // 이미지가 translate 되어 있으므로 clip-path는 element-local의 원본 중심에 고정
  const s = `circle(${r}px at ${introNaturalCenter.x}px ${introNaturalCenter.y}px)`;
  introLines.style.clipPath = s;
  introLines.style.webkitClipPath = s;
}

function startClipAnim(){
  if (clipAnimId) cancelAnimationFrame(clipAnimId);
  if (!revealed) {
    // 뗄 때: 즉시 사라짐
    currentRadius = 0;
    setClip(0);
    clipAnimId = null;
    return;
  }
  const from = currentRadius;
  const to = introMaxRadius;
  if (from === to) return;
  const start = performance.now();
  const dur = CLIP_DURATION * (Math.abs(to - from) / Math.max(introMaxRadius, 1));
  function step(now){
    const t = Math.min(1, (now - start) / Math.max(dur, 1));
    const eased = t * t * t; // easeInCubic — 느렸다 빨라짐
    currentRadius = from + (to - from) * eased;
    setClip(currentRadius);
    if (t < 1) {
      clipAnimId = requestAnimationFrame(step);
    } else {
      clipAnimId = null;
      // 방사가 완전히 끝났고, 여전히 호버 중이면 포토스피어로 진입
      if (revealed && hoveredSpot) {
        const target = hoveredSpot;
        hoveredSpot = null;
        selectCountry(target.country);
      }
    }
  }
  clipAnimId = requestAnimationFrame(step);
}

function applyIntroClip(){
  // 초기/리셋용 — 애니메이션 없이 즉시 반영
  if (clipAnimId) { cancelAnimationFrame(clipAnimId); clipAnimId = null; }
  currentRadius = revealed ? introMaxRadius : 0;
  setClip(currentRadius);
}
introDefault.addEventListener('load', positionHotspots);
addEventListener('resize', positionHotspots);

function selectCountry(name){
  currentCountry = name;
  const info = sequenceData[name];
  const urls = info.sequence.map(f => `${info.folder}/${encodeURIComponent(f)}`);

  greenFlash.classList.remove('fadeout');
  greenFlash.classList.add('show');
  document.getElementById('modeToggle').classList.add('hidden');
  setTimeout(() => {
    intro.classList.add('hidden');
    loading.style.display = 'flex';
    loading.textContent = `${name} 불러오는 중…`;
    initPhotosphere(urls, () => {
      greenFlash.classList.add('fadeout');
      greenFlash.classList.remove('show');
    });
  }, 700);
}

function initPhotosphere(urls, onReady){
  if (!renderer) setupThree();
  else resetSphere();

  const loader = new THREE.TextureLoader();
  let loaded = 0;
  textures = urls.map(src => loader.load(
    src,
    () => {
      if (++loaded === urls.length) {
        loading.style.display = 'none';
        backBtn.classList.add('show');
        if (onReady) onReady();
      }
    },
    undefined,
    err => console.warn('load fail', src, err)
  ));

  material.uniforms.texA.value = textures[0];
  material.uniforms.texB.value = textures[Math.min(1, textures.length-1)];
  material.uniforms.mixv.value = 0;

  lon = 0; lat = 0; prevLon = 0; spun = 0;

  if (!animating) { animating = true; animate(); }
}

function setupThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(110, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,0,0.01);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1);

  material = new THREE.ShaderMaterial({
    uniforms:{ texA:{value:null}, texB:{value:null}, mixv:{value:0} },
    vertexShader:`
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader:`
      uniform sampler2D texA; uniform sampler2D texB; uniform float mixv;
      varying vec2 vUv;
      void main(){ gl_FragColor = mix(texture2D(texA,vUv), texture2D(texB,vUv), mixv); }
    `
  });
  sphereMesh = new THREE.Mesh(geometry, material);
  scene.add(sphereMesh);

  bindControls();
}

function resetSphere(){
  textures.forEach(t => t && t.dispose && t.dispose());
  textures = [];
}

function bindControls(){
  const down = (x,y) => { onDrag=true; sx=x; sy=y; sLon=lon; sLat=lat; };
  const move = (x,y) => {
    if(!onDrag) return;
    lon = sLon - (x-sx)*0.18;
    lat = Math.max(-85, Math.min(85, sLat + (y-sy)*0.18));
  };
  const up = () => { onDrag = false; };

  container.addEventListener('mousedown', e => down(e.clientX, e.clientY));
  addEventListener('mousemove', e => move(e.clientX, e.clientY));
  addEventListener('mouseup', up);
  container.addEventListener('touchstart', e => down(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  container.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  container.addEventListener('touchend', up);
  container.addEventListener('wheel', e => {
    camera.fov = Math.max(30, Math.min(130, camera.fov + e.deltaY*0.03));
    camera.updateProjectionMatrix();
  }, {passive:true});

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function animate(){
  requestAnimationFrame(animate);
  if (!textures.length) { renderer.render(scene, camera); return; }

  spun += Math.abs(lon - prevLon);
  prevLon = lon;
  const last = textures.length - 1;
  const s = Math.min(spun, last * CYCLE_DEGREES);
  const i = Math.min(Math.floor(s / CYCLE_DEGREES), last);
  const within = s - i * CYCLE_DEGREES;
  const f = within < HOLD_DEGREES ? 0 : Math.min((within - HOLD_DEGREES) / TRANSITION_DEGREES, 1);
  material.uniforms.texA.value = textures[i];
  material.uniforms.texB.value = textures[Math.min(i+1, last)];
  material.uniforms.mixv.value = f;

  const phi = THREE.MathUtils.degToRad(90-lat);
  const theta = THREE.MathUtils.degToRad(lon);
  camera.lookAt(new THREE.Vector3(
    Math.sin(phi)*Math.cos(theta),
    Math.cos(phi),
    Math.sin(phi)*Math.sin(theta)
  ));
  renderer.render(scene, camera);
}

backBtn.addEventListener('click', () => {
  backBtn.classList.remove('show');
  intro.classList.remove('hidden');
  revealed = false;
  applyIntroClip();
  document.getElementById('modeToggle').classList.remove('hidden');
});

document.querySelectorAll('#modeToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#modeToggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.mode === 'satellite') {
      intro.classList.add('satellite');
    } else {
      intro.classList.remove('satellite');
      revealed = false;
      applyIntroClip();
    }
  });
});
</script>
</body>
</html>
