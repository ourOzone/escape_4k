<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>중심 찍기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;}
  #stage{flex:1;position:relative;overflow:hidden;background:#000;}
  #img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;cursor:crosshair;}
  .marker{
    position:absolute;transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;
    background:rgba(255,60,60,0.7);border:2px solid #fff;
    pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,0.7);
  }
  .marker::before,.marker::after{
    content:'';position:absolute;background:#fff;
  }
  .marker::before{left:50%;top:-8px;width:1px;height:calc(100% + 16px);transform:translateX(-50%);}
  .marker::after{top:50%;left:-8px;height:1px;width:calc(100% + 16px);transform:translateY(-50%);}
  .marker .lbl{
    position:absolute;top:34px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.75);padding:2px 8px;border-radius:10px;
    font-size:11px;white-space:nowrap;color:#fff;
  }
  #panel{
    width:340px;background:#1a1a1a;border-left:1px solid #333;
    padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;
  }
  h2{font-size:14px;font-weight:600;letter-spacing:0.1em;}
  .row{display:flex;gap:8px;align-items:center;}
  select,button{
    background:#2a2a2a;color:#fff;border:1px solid #444;
    padding:6px 10px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  button:hover{background:#3a3a3a;}
  #out{background:#000;border:1px solid #333;padding:10px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre;overflow:auto;max-height:220px;color:#8f8;}
  .hint{font-size:11px;opacity:0.6;line-height:1.5;}
  .info{font-family:ui-monospace,monospace;font-size:13px;color:#8f8;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <img id="img" src="img/인트로/디폴트.png" alt="">
  </div>
  <div id="panel">
    <h2>중심 좌표 찍기</h2>
    <div class="hint">
      이미지 위에서 방사형 확장의 중심이 될 지점을 클릭하세요.<br>
      좌표는 이미지 기준 %(0~100)로 저장됩니다.
    </div>
    <div class="row">
      <label>이미지:</label>
      <select id="imgSel">
        <option value="img/인트로/디폴트.png">디폴트.png</option>
        <option value="img/인트로/디폴트_선.png">디폴트_선.png</option>
      </select>
      <button id="clearBtn">지우기</button>
    </div>
    <h2>중심 좌표</h2>
    <div class="info" id="info">아직 없음</div>
    <h2>index.html용 CSS</h2>
    <div id="out">// 클릭하면 여기 표시됩니다</div>
    <button id="copyBtn">CSS 복사</button>
  </div>
</div>

<script>
const img = document.getElementById('img');
const stage = document.getElementById('stage');
const info = document.getElementById('info');
const out = document.getElementById('out');
const imgSel = document.getElementById('imgSel');
let center = null; // {xPct, yPct}

imgSel.addEventListener('change', () => { img.src = imgSel.value; });

function getImageRect(){
  const r = stage.getBoundingClientRect();
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return { left: r.left, top: r.top, width: r.width, height: r.height };
  const scale = Math.min(r.width/iw, r.height/ih);
  const w = iw*scale, h = ih*scale;
  return { left: r.left + (r.width-w)/2, top: r.top + (r.height-h)/2, width: w, height: h };
}

img.addEventListener('click', e => {
  const rect = getImageRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) return;
  center = { xPct: +xPct.toFixed(2), yPct: +yPct.toFixed(2) };
  render();
});

function render(){
  stage.querySelectorAll('.marker').forEach(m => m.remove());
  if (!center) {
    info.textContent = '아직 없음';
    out.textContent = '// 클릭하면 여기 표시됩니다';
    return;
  }
  const rect = getImageRect();
  const stageRect = stage.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'marker';
  const px = rect.left - stageRect.left + rect.width * center.xPct/100;
  const py = rect.top - stageRect.top + rect.height * center.yPct/100;
  m.style.left = px + 'px';
  m.style.top = py + 'px';
  m.innerHTML = `<span class="lbl">${center.xPct}%, ${center.yPct}%</span>`;
  stage.appendChild(m);

  info.textContent = `xPct: ${center.xPct}, yPct: ${center.yPct}`;
  out.textContent =
`// index.html의 HOTSPOTS 아래에 추가
const INTRO_CENTER = { xPct: ${center.xPct}, yPct: ${center.yPct} };`;
}

document.getElementById('clearBtn').addEventListener('click', () => {
  center = null;
  render();
});
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(out.textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    const t = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = t, 1200);
  });
});
window.addEventListener('resize', render);
img.addEventListener('load', render);
</script>
</body>
</html>
