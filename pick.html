<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>좌표 찍기</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;}
  #stage{flex:1;position:relative;overflow:hidden;background:#000;}
  #img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;cursor:crosshair;}
  .marker{
    position:absolute;transform:translate(-50%,-50%);
    width:22px;height:22px;border-radius:50%;
    background:rgba(46,204,113,0.85);border:2px solid #fff;
    pointer-events:none;box-shadow:0 0 10px rgba(0,0,0,0.6);
  }
  .marker .lbl{
    position:absolute;top:26px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,0.75);padding:2px 8px;border-radius:10px;
    font-size:11px;white-space:nowrap;color:#fff;
  }
  #panel{
    width:320px;background:#1a1a1a;border-left:1px solid #333;
    padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;
  }
  h2{font-size:14px;font-weight:600;letter-spacing:0.1em;}
  .row{display:flex;gap:8px;align-items:center;}
  select,button{
    background:#2a2a2a;color:#fff;border:1px solid #444;
    padding:6px 10px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  button:hover{background:#3a3a3a;}
  .list{display:flex;flex-direction:column;gap:6px;font-size:12px;font-family:ui-monospace,monospace;}
  .list .item{background:#222;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .list .item .rm{background:#3a1a1a;border-color:#552;color:#f88;padding:2px 8px;font-size:11px;}
  #out{background:#000;border:1px solid #333;padding:10px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre;overflow:auto;max-height:220px;color:#8f8;}
  .hint{font-size:11px;opacity:0.6;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <img id="img" src="img/인트로/디폴트_1.png" alt="">
  </div>
  <div id="panel">
    <h2>좌표 찍기</h2>
    <div class="hint">
      아래에서 나라를 고르고 이미지의 흰 점을 클릭하세요.<br>
      좌표는 이미지 기준 %(0~100)로 저장됩니다.
    </div>
    <div class="row">
      <label>나라:</label>
      <select id="country">
        <option>한국</option>
        <option>일본</option>
        <option>홍콩</option>
        <option>인도</option>
      </select>
      <button id="clearBtn">전체 지우기</button>
    </div>
    <h2>기록</h2>
    <div class="list" id="list"></div>
    <h2>HOTSPOTS 코드</h2>
    <div id="out">// 클릭하면 여기 표시됩니다</div>
    <button id="copyBtn">코드 복사</button>
  </div>
</div>

<script>
const img = document.getElementById('img');
const stage = document.getElementById('stage');
const countrySel = document.getElementById('country');
const listEl = document.getElementById('list');
const out = document.getElementById('out');
const points = {}; // country -> {xPct, yPct}

function getImageRect(){
  // object-fit: contain — 실제 그려진 이미지 영역 계산
  const r = stage.getBoundingClientRect();
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return { left: r.left, top: r.top, width: r.width, height: r.height };
  const scale = Math.min(r.width/iw, r.height/ih);
  const w = iw*scale, h = ih*scale;
  return { left: r.left + (r.width-w)/2, top: r.top + (r.height-h)/2, width: w, height: h };
}

img.addEventListener('click', e => {
  const rect = getImageRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) return;
  const country = countrySel.value;
  points[country] = { xPct: +xPct.toFixed(2), yPct: +yPct.toFixed(2) };
  render();
  // 다음 나라 자동 선택
  const opts = [...countrySel.options].map(o => o.value);
  const remaining = opts.filter(c => !points[c]);
  if (remaining.length) countrySel.value = remaining[0];
});

function render(){
  // 마커 다시 그리기
  stage.querySelectorAll('.marker').forEach(m => m.remove());
  const rect = getImageRect();
  const stageRect = stage.getBoundingClientRect();
  Object.entries(points).forEach(([country, p]) => {
    const m = document.createElement('div');
    m.className = 'marker';
    const px = rect.left - stageRect.left + rect.width * p.xPct/100;
    const py = rect.top - stageRect.top + rect.height * p.yPct/100;
    m.style.left = px + 'px';
    m.style.top = py + 'px';
    m.innerHTML = `<span class="lbl">${country} ${p.xPct}%, ${p.yPct}%</span>`;
    stage.appendChild(m);
  });
  // 리스트
  listEl.innerHTML = '';
  Object.entries(points).forEach(([country, p]) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span>${country}: ${p.xPct}%, ${p.yPct}%</span><button class="rm" data-c="${country}">삭제</button>`;
    listEl.appendChild(div);
  });
  listEl.querySelectorAll('.rm').forEach(b => {
    b.addEventListener('click', () => { delete points[b.dataset.c]; render(); });
  });
  // 코드 출력
  const order = ['한국','일본','홍콩','인도'];
  const lines = order
    .filter(c => points[c])
    .map(c => `  { country: '${c}', xPct: ${points[c].xPct}, yPct: ${points[c].yPct} },`);
  out.textContent = lines.length
    ? 'const HOTSPOTS = [\n' + lines.join('\n') + '\n];'
    : '// 클릭하면 여기 표시됩니다';
}

document.getElementById('clearBtn').addEventListener('click', () => {
  for (const k in points) delete points[k];
  render();
});
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(out.textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    const t = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(() => btn.textContent = t, 1200);
  });
});
window.addEventListener('resize', render);
img.addEventListener('load', render);
</script>
</body>
</html>
